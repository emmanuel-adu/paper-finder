name: PR issue link

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-issue-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for an issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const closingKeyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+(?:[\w.-]+\/[\w.-]+)?#(?!123\b)\d+\b/i;
            const noIssue = /\bIssue:\s*N\/A\b/i;

            if (!closingKeyword.test(body) && !noIssue.test(body)) {
              core.setFailed(
                "Add a closing issue reference such as `Closes #7` to the PR description. " +
                "For work that intentionally has no issue, add `Issue: N/A` and explain why."
              );
            }